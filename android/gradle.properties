# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Use SerialGC with adequate Metaspace and 1024m heap
org.gradle.jvmargs=-XX:+UseSerialGC -Xms128m -Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=D:\\GradleHome\\tmp
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
android.useAndroidX=true
android.enableJetifier=false

# Disable automatic NDK downloads
android.ndk.autoDownload=false
org.gradle.android.ndk.autoDownload=false

# Run Kotlin compiler in-process to prevent spawning a secondary JVM that runs out of paging file memory
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-XX:+UseSerialGC -Xmx384m -XX:MaxMetaspaceSize=384m
