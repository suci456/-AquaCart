name: aquacart
description: "AquaCart - Premium Water Purifier E-Commerce, Service & Dealer Wholesale Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Firebase Core, Auth & Cloud Firestore
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.7
  cloud_firestore: ^4.17.5

  # Networking & Data
  http: ^1.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Payment Gateway (Razorpay test mode)
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
